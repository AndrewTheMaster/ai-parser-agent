[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-terms-agent"
version = "0.1.0"
description = "LangGraph agent: extract legal terms, lookup Black's Law Dictionary PDFs, optional RU law RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "pypdf>=4.0",
    "python-docx>=1.1.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "nltk>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
legal-agent = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
